<!doctype html>
<html lang="id" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIELDWORK — Sistem Operasional & Pemantauan Lapangan</title>
    <meta name="description" content="Field Work Documentation, Attendance & Anomaly Monitoring System" />
    <meta property="og:title" content="FIELDWORK" />
    <meta property="og:description" content="Field Work Documentation, Attendance & Anomaly Monitoring System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      (function () {
        try {
          var key = 'fw_theme_preference_v1';
          var stored = localStorage.getItem(key);
          var pref = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'light';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = pref === 'dark' || (pref === 'system' && sysDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          /* ignore storage/matchMedia errors */
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
